version: 2

builds:
  - id: discord-proxy
    main: ./cmd/proxy
    binary: discord-proxy
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
  - id: discover
    main: ./cmd/discover
    binary: discover
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
  - id: tray
    main: ./cmd/tray
    binary: discord-proxy-tray
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  # The tray exists on Linux only, so it cannot share an archive with builds that
  # are produced for every platform: goreleaser rejects an archive whose binary
  # count differs per target (see goreleaser.com/errors/multiple-binaries-archive).
  - id: proxy
    formats:
      - zip
    ids:
      - discord-proxy
      - discover
    files:
      - src: configs/config.example.yaml
        dst: config.example.yaml
      - src: LICENSE
        dst: LICENSE
      - src: README.md
        dst: README.md
  - id: tray
    formats:
      - zip
    ids:
      - tray
    name_template: "{{ .ProjectName }}-tray_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: LICENSE
        dst: LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

release:
  github:
    owner: dipievil
    name: discord-proxy-rpc
  mode: append
  make_latest: true
